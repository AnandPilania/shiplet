; Shiplet — PHP development configuration
[PHP]
display_errors         = On
display_startup_errors = On
error_reporting        = E_ALL
html_errors            = Off
log_errors             = On
error_log              = /var/log/php_errors.log

; Performance
memory_limit          = 256M
max_execution_time    = 300
max_input_time        = 300
post_max_size         = 100M
upload_max_filesize   = 100M
max_file_uploads      = 20

; OPcache (development — validates every request)
opcache.enable        = 1
opcache.memory_consumption = 128
opcache.revalidate_freq    = 0

; Timezone
date.timezone = UTC
